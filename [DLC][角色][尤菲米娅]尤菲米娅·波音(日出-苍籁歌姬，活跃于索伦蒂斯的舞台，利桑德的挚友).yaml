尤菲米娅·波音:
  基本信息:
    称号: 苍籁歌姬, 赛瑞利亚之星
    暱稱: 尤菲(家人/挚友)
    性别: 女性
    年龄: 20
    种族: 人鱼 (纯血)
    阵营: 混乱善良
    生命层级: 第三层级
    等级: 10
    身份: 人鱼歌姬, 女神选美大赛季军
    职业: 吟游诗人, 潮汐歌者

  背景故事:
    出身: 索伦蒂斯赛瑞利亚自治区的纯血人鱼，代表着人鱼族中最向往自由与享乐的一派。作為苍籁剧场的著名歌姬，凭借出众的歌喉与魅力在陆地世界获得极高的人气
    关键经历:
      - 幼年结识利桑德家族的莉利亚，两人是青梅竹马与挚友，后来因利桑德家族搬迁而分离，这段回忆成为她心中最珍贵的宝物
      - 少女时期展现出纯血人鱼罕见的歌唱天赋，一次近海风暴中无意以歌声平息狂乱潮汐，自此被苍籁剧场发掘的年轻歌者，闻名于沿海诸国
      - 将女神选美大赛视作自己加冕的舞台，却最终仅取得季军。她在人前优雅接受结果，私下却将奖章收进盒底，认定这只是一次尚未唱完的演出
      - 保存着与莉利亚共同绘制的另一半海洋图谱，偶尔能从残片中感受到微弱而熟悉的潮汐共鸣。如今成为两人的相聚的信号
    当前状态: 目前仍在苍籁剧场担任歌姬，偶尔会在沿海诸国的舞台上进行巡演，享受掌声与喝彩。在闲暇拜访莉利亚，彼此仍保持着深厚的友谊与默契

  外貌:
    整体印象: 冶艳张扬，举止从容慵懒，自带长期站在舞台中央的强烈存在感
    面部: 五官明艳，眼角点缀着数片泛光的细小人鱼鳞，耳侧则生有纯血人鱼特有的薄鳍状耳
    体型身材: 身高170cm(人形)，曲线丰盈柔韧，腰肢纤细灵活
    发型发色: 浓密湖蓝色长卷发垂至腰际，湿润时泛出深海般的渐层光泽
    眼睛: 蓝色至淡粉色渐变
    穿着风格:
      人魚礼服: 
        - 以赛瑞利亚人鱼舞台服饰为原型的纯白贝壳泳装，搭配珊瑚流苏与银色亮片装饰的半透薄纱长裙
        - 佩戴以海洋元素为灵感的银色耳坠与手链
      日常穿着:
        - 湖蓝色丝质居家便袍，长袖宽松，前襟低开，以柔软腰带松系腰间
        - 下摆单侧开衩，露出自腰侧向下延伸的海蓝色鳞片与鱼尾
    显著特征:
      - 眼角保留人鱼鳞片，人形皮肤在强光与潮湿环境下会浮现微弱珠光
      - 华丽高调，深海歌姬风格，兼具歌姬的华美与人鱼的异族魅力与自信

  身体数据:
