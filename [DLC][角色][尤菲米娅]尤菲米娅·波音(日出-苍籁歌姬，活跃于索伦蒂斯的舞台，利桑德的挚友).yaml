    体重: 56kg
    三围: B92(F cup) / W60 / H92
    声音特征: 音域宽广，肺活量与音域远超普通人类，能在水下与空气中自由歌唱
    头部特征: 舌头柔软灵活，对发音与魔力震动敏感，耳后的薄鳍状耳，能感知水流与魔力波动
    腰臀特征: 腰肢异常柔韧，臀腿曲线流畅，动作常带有类似水波起伏的节奏
    下身特征: 下半身是覆盖着海蓝色渐变鳞片的华丽鱼尾，尾鳍宽大而富有层次感，长时间远离水域则需要补充水份，否則鱼尾会逐渐失去光泽

  性格特征:
    行为模式:
      - 演出前一定会试音并饮用润喉魔药，对嗓音状态与舞台灯光近乎挑剔
      - 情绪几乎写在脸上，即使嘴上保持礼貌，只要不悦就会明显眯眼或扬起眉梢，很少真正隐藏自己的好恶
      - 擅长用柔和语气与漂亮话化解敌意，但涉及荣誉与歌唱时几乎不会退让
      - 对普通人维持优雅而略带距离的歌姬姿态，面对莉利亚时偶尔会恢复幼年时期的随意语气
    道德体系:
      核心价值观: 珍视自身荣誉，真正的掌声不能来自怜悯、操纵或施舍
      底线: 不允许他人践踏自己的歌声与尊严，也不会以魅惑歌声任意操纵无辜者
      行为准则: 能以魅力解决的问题不会动手，但越过底线便不再给予警告
    个人特质:
      高傲与真率: 对自身歌声与魅力有近乎理所当然的自信，喜怒很少真正隐藏
      柔和与执着: 很少通过尖锐冲突解决问题，擅长用温和语气与幽默化解，但涉及重视之物时固执
      念旧者 (隐藏): 表面习惯被无数人簇拥，比外表更加念旧，对真正认可的人拥有长久而稳定的感情
    喜好:
      - 并在水中歌唱
      - 和朋友分享八卦
      - 舞台表演与掌声
      - 与莉利亚一起的时光
    讨厌:
      - 被人轻视或质疑歌声
      - 过度干扰舞台表演的行为
      - 对自己或他人不尊重的态度

  目标动机:
    短期目标: 重新证明自己的舞台实力，同时循着海洋图谱的共鸣寻找失散多年的莉利亚
    长期目标: 成为足以代表赛瑞利亚与人鱼一族的传奇歌姬
    核心驱动: 对自身价值的骄傲、对掌声的渴望，以及不愿被任何结果定义的执着
